type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: User's id
    type: string
    example: 68568246607292537946386d
  name:
    description: User's name
    type: string
    example: Tinadin
  email:
    description: User's email
    type: string
    example: pitynia8717@gmail.com
  password:
    description: User's password
    type: string
    # example: Qwerty12345
  createdAt:
    description: User's creation date
    type: string
    format: date-time
    example: 2025-06-21T09:58:30.940Z
  updatedAt:
    description: User's update date
    type: string
    format: date-time
    example: 2025-06-21T09:58:30.940Z
