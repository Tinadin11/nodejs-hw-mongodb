tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create a contact with payload
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: Contact's name
            type: string
            example: Tim
          phoneNumber:
            description: Contact's phone number
            type: string
            example: 380999999999
          email:
            description: Contact's email
            type: string
            example: pitynia8717@gmail.com
          isFavourite:
            description: Whether is contact is favourite
            type: boolean
            example: false
            default: false
          contactType:
            description: Contact's type
            type: string
            enum: ['work', 'home', 'personal']
            example: home
            default: work
          photo:
            description: Link to contact's photo
            type: string
            format: binary
            example: https://res.cloudinary.com/dkfw5jlaz/image/upload/v1750528648/vljwc0mnxg6kkv98fesl.jpg
            default: null
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '500':
    $ref: ../../components/responses/500.yaml